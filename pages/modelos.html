<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinancasApp - Fixas/Parceladas</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <div class="container">

    <header class="topo-pagina">
      <h1>Fixas/Parceladas</h1>
      <button id="btn-sair" class="botao-sair">Sair</button>
    </header>

    <p style="font-size:13px; color:var(--cor-texto-suave); margin-top:-8px;">
      Contas mensais e parceladas cadastradas aqui geram as parcelas automaticamente todo mês.
    </p>

    <div id="lista-modelos" class="lista-contas"></div>

  </div>

  <button id="btn-novo-modelo" class="botao-flutuante" aria-label="Nova conta fixa">+</button>

  <div id="fundo-modal" class="fundo-modal" hidden>
    <div class="conteudo-modal">
      <h2 id="titulo-modal">Nova conta fixa</h2>
      <form id="form-modelo">

        <input type="hidden" id="campo-id">

        <div class="campo">
          <label for="campo-tipo">Tipo</label>
          <select id="campo-tipo" required>
            <option value="fixa_mensal">Fixa mensal (sem fim)</option>
            <option value="fixa_parcelada">Fixa parcelada (com fim)</option>
          </select>
        </div>

        <div class="campo">
          <label for="campo-descricao">Descrição</label>
          <input type="text" id="campo-descricao" required>
        </div>

        <div class="campo">
          <label for="campo-categoria">Categoria</label>
          <select id="campo-categoria" required></select>
        </div>

        <div class="campo">
          <label for="campo-valor">Valor da parcela</label>
          <input type="number" id="campo-valor" step="0.01" min="0.01" required>
        </div>

        <div class="campo">
          <label for="campo-dia-vencimento">Dia do vencimento (1-31)</label>
          <input type="number" id="campo-dia-vencimento" min="1" max="31" required>
        </div>

        <div class="campo">
          <label for="campo-data-inicio">A partir de qual mês/ano</label>
          <input type="month" id="campo-data-inicio" required>
        </div>

        <div class="campo" id="campo-parcelas-container" hidden>
          <label for="campo-parcelas">Quantidade de parcelas</label>
          <input type="number" id="campo-parcelas" min="1">
        </div>

        <div class="acoes-modal">
          <button type="button" id="btn-cancelar-modal" class="botao botao-secundario">Cancelar</button>
          <button type="submit" class="botao botao-primario">Salvar</button>
        </div>

      </form>
    </div>
  </div>

  <nav id="nav-app"></nav>

  <script src="../js/api.js"></script>
  <script src="../js/util.js"></script>
  <script src="../js/modelos.js"></script>

</body>
</html>
